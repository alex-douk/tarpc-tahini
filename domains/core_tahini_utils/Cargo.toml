[package]
name = "core_tahini_utils"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0.219", features = ["derive", "serde_derive"] }
serde_json = "1.0.140"

sesame = { git = "https://github.com/brownsys/Sesame.git", branch = "tahini-dev"}
sesame_rocket = { git = "https://github.com/brownsys/Sesame.git", branch = "tahini-dev"}
sesame_mysql = { git = "https://github.com/brownsys/Sesame.git", branch = "tahini-dev"}
tahini_tarpc = { git = "https://github.com/alex-douk/tahini_lib.git", branch = "standalone_tahini", features = ["derive"]}
mysql = "21.0.2"
rocket = { git = "https://github.com/KinanBab/Rocket.git", branch = "main", features= ["json"] }

[lib]
name="core_tahini_utils"
path="src/lib.rs"

# [features]
# client = ["alohomora/tahini_client"]
# server = ["alohomora/tahini_server"]

[patch.crates-io]
funty = { git = "https://github.com/bitvecto-rs/funty/", rev = "7ef0d890fbcd8b3def1635ac1a877fc298488446" }
# url={version="=2.5.0"}

[dependencies.url]
version = "=2.5.0"

[dependencies.icu_properties_data]
version = "=1.5.1"

[dependencies.pest]
version="=2.8.0"

[dependencies.pest_meta]
version="=2.8.0"

[dependencies.pest_generator]
version="=2.8.0"

[dependencies.native-tls]
version="=0.2.11"
