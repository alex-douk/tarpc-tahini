[package]
name = "llm_tahini_utils"
version = "0.1.0"
edition = "2021"

[dependencies]
tarpc = { version = "0.34.0", features = ["full"] }
serde = { version = "1.0.219", features = ["derive", "serde_derive"] }
serde_json = "1.0.140"
core_tahini_utils = {version = "0.1.0", path = "../core_tahini_utils/"}

sesame = { git = "https://github.com/brownsys/Sesame.git", branch = "tahini-dev", default-features = false, features = ["derive"] }
tahini_tarpc = { git = "https://github.com/alex-douk/tahini_lib.git", branch = "standalone_tahini", features = ["derive"]}

[lib]
name="llm_tahini_utils"
path="src/lib.rs"
