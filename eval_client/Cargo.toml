[package]
name = "eval_client"
version = "0.1.0"
edition = "2021"

[dependencies]
futures = "0.3.31"
futures-util = "0.3.31"
tokio = { version = "1.42.0", features = ["full", "rt", "rt-multi-thread", "tokio-macros"] }
tokio-macros = "2.4.0"
tokio-util = "0.7.13"
anyhow = "1.0.94"
tarpc = "0.34.0"
serde = { version = "1.0.219", features = ["derive", "serde_derive"] }
rand = "0.8.0"
core_tahini_utils = {version="0.1.0", path="../domains/core_tahini_utils/"}
advertisement_tahini_utils = {version="0.1.0", path="../domains/advertisement_tahini_utils/"}
llm_tahini_utils = {version="0.1.0", path="../domains/llm_tahini_utils"}
database_tahini_utils = {version = "0.1.0", path = "../domains/database_tahini_utils"}
lazy_static = "1.5.0"

alohomora = { git = "https://github.com/brownsys/Sesame.git", branch = "tahini-dev", default-features = false, features = ["derive"] }
tahini_tarpc = { git = "https://github.com/alex-douk/tahini_lib.git", branch = "standalone_tahini", features = ["derive"]}
tracing = "0.1.41"
log = "0.4.27"
slog = "2.7.0"
slog-async = "2.8.0"
slog-term = "2.9.2"
tracing-subscriber = "0.3.20"
tracing-appender = "0.2.3"
random = "0.14.0"
uuid = { version = "1.18.0", features = ["v4"] }
reqwest = { version = "=0.11.5", features = ["cookies"] }

[[bin]]
name="eval_client"
path="./src/eval_client.rs"

[[bin]]
name="http_client"
path="./src/http_client.rs"

[dependencies.url]
version = "=2.5.0"

[dependencies.icu_properties_data]
version = "=1.5.1"

[dependencies.pest]
version="=2.8.0"

[dependencies.pest_meta]
version="=2.8.0"

[dependencies.pest_generator]
version="=2.8.0"

[dependencies.native-tls]
version="=0.2.11"
